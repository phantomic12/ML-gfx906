name: Publish APT repo to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag whose *.deb assets become the apt repo (empty = latest release)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KEY_ID: ${{ vars.APT_KEY_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: apt-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release: $TAG"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$KEY_ID:6:" | gpg --batch --import-ownertrust

      - name: Download .deb assets from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          gh release download "${{ steps.tag.outputs.tag }}" --pattern '*.deb' --dir debs
          echo "Downloaded $(find debs -name '*.deb' | wc -l) debs:"
          du -sh debs

      - name: Build flat apt index (Packages + Release + InRelease)
        env:
          DEBS_DIR: debs
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          SITE_DIR: site
        run: ./scripts/build-apt-index.sh

      - name: Upload index files to release (flat repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            site/Packages site/Packages.gz site/Packages.xz \
            site/Release site/InRelease site/Release.gpg \
            site/pubkey.asc --clobber
          echo "Index uploaded to release ${{ steps.tag.outputs.tag }}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
