name: Publish APT repo to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag whose *.deb assets become the apt index (empty = latest release)'
        required: false
        type: string
      distribution:
        description: 'apt suite/codename (matches Ubuntu codename, e.g. noble)'
        required: false
        default: noble
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DISTRIBUTION: ${{ inputs.distribution || 'noble' }}
  KEY_ID: ${{ vars.APT_KEY_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Holds APT_GPG_PRIVATE_KEY. Pages deployment happens in the separate
    # `deploy` job, which must run in the `github-pages` environment.
    environment: apt-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            TAG="$INPUT_RELEASE_TAG"
          else
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "could not determine a release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release: $TAG"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg zstd

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ]; then
            echo "repository variable APT_KEY_ID is not set"
            exit 1
          fi
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "repository secret APT_GPG_PRIVATE_KEY is not set"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$KEY_ID:6:" | gpg --batch --import-ownertrust

      - name: Download .deb assets from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p debs
          gh release download "$RELEASE_TAG" --pattern '*.deb' --dir debs
          echo "Downloaded $(find debs -name '*.deb' | wc -l) debs:"
          du -sh debs

      - name: Build apt index (Packages + Release + InRelease)
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download
          SITE_DIR: site
        run: ./scripts/build-apt-index.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
