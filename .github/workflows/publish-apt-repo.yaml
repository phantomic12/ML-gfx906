name: Publish APT repo to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag whose *.deb assets become the apt index (empty = latest release)'
        required: false
        type: string
      distribution:
        description: 'apt suite/codename (matches Ubuntu codename, e.g. noble)'
        required: false
        default: noble
        type: string
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DISTRIBUTION: ${{ inputs.distribution || 'noble' }}
  KEY_ID: ${{ vars.APT_KEY_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: apt-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release: $TAG"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$KEY_ID:6:" | gpg --batch --import-ownertrust

      - name: Download .deb assets from release
        run: |
          mkdir -p debs
          gh release download "${{ steps.tag.outputs.tag }}" --pattern '*.deb' --dir debs
          echo "Downloaded $(find debs -name '*.deb' | wc -l) debs:"
          du -sh debs

      - name: Build apt index (Packages + Release + InRelease)
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download
          SITE_DIR: site
        run: ./scripts/build-apt-index.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
