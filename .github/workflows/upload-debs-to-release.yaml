name: Upload .deb files to release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach debs to (created if missing)'
        required: true
        type: string
      deb_paths:
        description: 'Glob(s) of .deb files to upload, space-separated (e.g. "output/**/*.deb amd-memory-tweak/output/**/*.deb")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload debs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEB_PATHS: ${{ inputs.deb_paths }}
        run: |
          shopt -s globstar nullglob
          FILES=()
          for g in $DEB_PATHS; do
            for f in $g; do
              [ -f "$f" ] && FILES+=("$f")
            done
          done
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No .deb files matched: $DEB_PATHS"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "gfx906 package build"
          fi
          gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          echo "Uploaded:"
          ls -lh "${FILES[@]}"
