name: Upload .deb files to release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach debs to (created if missing)'
        required: true
        type: string
      deb_paths:
        description: 'Glob(s) of .deb files to upload, space-separated (e.g. "output/**/*.deb amd-memory-tweak/output/**/*.deb")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload debs
        run: |
          # shellcheck disable=SC2086
          DEBS=$(find . -path ./node_modules -prune -o -name '*.deb' -print 2>/dev/null | head -500 || true)
          # Respect user globs
          FILES=""
          for g in ${{ inputs.deb_paths }}; do
            FILES="$FILES $(ls -1 $g 2>/dev/null || true)"
          done
          if [ -z "$FILES" ]; then
            echo "No .deb files matched: ${{ inputs.deb_paths }}"
            exit 1
          fi
          # shellcheck disable=SC2086
          gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1 \
            || gh release create "${{ inputs.release_tag }}" --title "${{ inputs.release_tag }}" --notes "gfx906 package build" || true
          # shellcheck disable=SC2086
          gh release upload "${{ inputs.release_tag }}" $FILES --clobber
          echo "Uploaded:"
          ls -lh $FILES
