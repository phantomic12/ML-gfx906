name: Dotnet unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "llama.cpp/llamacpp-offload-calculator/**"
      - "vllm/benchmark/ResultsConverter/**"
      - ".github/workflows/dotnet-tests.yaml"
  pull_request:
    paths:
      - "llama.cpp/llamacpp-offload-calculator/**"
      - "vllm/benchmark/ResultsConverter/**"
      - ".github/workflows/dotnet-tests.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - llama.cpp/llamacpp-offload-calculator/ArkProjects.LlamaOffloadCalc.sln
          - llama.cpp/llamacpp-offload-calculator/GGUFSharp/src/GGUFSharp/GGUFSharp.sln
          - vllm/benchmark/ResultsConverter/ResultsConverter.sln
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run tests
        run: dotnet test "${{ matrix.solution }}" --configuration Release
